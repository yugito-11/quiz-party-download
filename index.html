<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Quiz Party – Beitreten</title>
<meta name="description" content="Gib den PIN ein, den dein Gamemaster zeigt, und spiel mit.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 22'%3E%3Cpath d='M6 0h10l-6 22H0z' fill='%23ffd23f'/%3E%3Cpath d='M19 0h11l-6 22H13z' fill='%233346f0'/%3E%3C/svg%3E">
<style>
  @font-face { font-family: 'GameDisplay'; src: url('fonts/game-display-900.woff2') format('woff2'); font-weight: 900; font-display: swap; }
  @font-face { font-family: 'GameLabel'; src: url('fonts/game-label-700.woff2') format('woff2'); font-weight: 700; font-display: swap; }
  @font-face { font-family: 'GameText'; src: url('fonts/game-text-600.woff2') format('woff2'); font-weight: 600; font-display: swap; }
  :root { --bg: #13112e; --field: #0e0c26; --line: #2c2874; --accent: #ffd23f; --accent-ink: #1b1500; --accent-edge: #b8901a; --bad: #ff4f6d; --text-2: #bcb8ec; --text-3: #8b86c8; color-scheme: dark; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 18px; color: #fff; font-family: 'GameText', system-ui, sans-serif; font-weight: 600;
    background: var(--bg) repeating-linear-gradient(-45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 14px); }
  main { width: 100%; max-width: 380px; text-align: center; }
  .mark { width: 66px; height: 48px; }
  h1 { font-family: 'GameDisplay', sans-serif; font-weight: 900; text-transform: uppercase; font-size: 3.2rem; line-height: .95; margin: 14px 0 6px; }
  h1 span { color: var(--accent); }
  p { color: var(--text-2); margin: 0 0 26px; }
  input { width: 100%; height: 72px; text-align: center; font-family: 'GameDisplay', sans-serif; font-weight: 900; font-size: 3rem; letter-spacing: .25em; color: #fff;
    background: var(--field); border: 2px solid var(--line); border-radius: 3px; outline: none; }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: #3a358f; }
  button { width: 100%; height: 60px; margin-top: 12px; border: 0; cursor: pointer; font-family: 'GameDisplay', sans-serif; font-weight: 900; font-size: 1.7rem; text-transform: uppercase;
    background: var(--accent); color: var(--accent-ink); box-shadow: inset 0 -5px 0 var(--accent-edge); clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }
  button:active { transform: translateY(2px); }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { min-height: 2.6em; margin-top: 16px; color: var(--text-2); }
  .msg.err { color: var(--bad); }
  footer { margin-top: 30px; font-family: 'GameLabel', sans-serif; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 30 22" aria-hidden="true"><path d="M6 0h10l-6 22H0z" fill="#ffd23f"/><path d="M19 0h11l-6 22H13z" fill="#3346f0"/></svg>
  <h1>Quiz<span>/</span>Party</h1>
  <p>Gib den PIN ein, den dein Gamemaster zeigt.</p>
  <form id="f"><input id="pin" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="0000" aria-label="Spiel-PIN" required><button id="go">Beitreten</button></form>
  <div class="msg" id="msg" role="status"></div>
  <footer>Kein Download nötig</footer>
</main>
<script>
// Adressbuch: Die Quiz-Party-App trägt dort "PIN → Adresse ihres Online-Zugangs" ein.
const params = new URLSearchParams(location.search);
const local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const RELAY = (local && params.get('relay')) || 'https://ntfy.sh';   // Test-Adressbuch nur lokal erlaubt
const NS = 'quizparty-yugito11';
const $ = (id) => document.getElementById(id);
const say = (t, err) => { $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); };

async function lookup(pin) {
  const r = await fetch(`${RELAY}/${NS}-${pin}/json?poll=1&since=12h`, { cache: 'no-store' });
  if (!r.ok) throw new Error('Adressbuch nicht erreichbar – bitte gleich nochmal versuchen.');
  const lines = (await r.text()).trim().split('\n').filter(Boolean).map((l) => { try { return JSON.parse(l); } catch { return null; } });
  const msgs = lines.filter((m) => m && m.event === 'message');
  for (const m of msgs.reverse()) {
    try { const d = JSON.parse(m.message); if (/^https?:\/\//.test(d.url)) return d.url; } catch {}
  }
  return null;
}
async function reachable(url) {
  try { await fetch(url + '/api/info', { mode: 'no-cors', cache: 'no-store', signal: AbortSignal.timeout(6000) }); return true; } catch { return false; }
}
async function join(pin) {
  pin = String(pin).replace(/\D/g, '');
  if (pin.length !== 4) return say('Der PIN hat 4 Ziffern.', true);
  $('go').disabled = true; say('Suche das Spiel …');
  try {
    const url = await lookup(pin);
    if (!url) return say('Kein Spiel mit diesem PIN gefunden. Stimmt der PIN?', true);
    if (!(await reachable(url))) return say('Das Spiel ist gerade nicht erreichbar. Läuft Quiz Party beim Gamemaster noch?', true);
    say('Gefunden – einen Moment …');
    location.href = url.replace(/\/$/, '') + '/?pin=' + pin;
  } catch (e) { say(e.message || 'Etwas ist schiefgelaufen.', true); }
  finally { $('go').disabled = false; }
}
$('f').onsubmit = (e) => { e.preventDefault(); join($('pin').value); };
const p = params.get('pin');
if (p) { $('pin').value = p; join(p); } else $('pin').focus();
</script>
</body>
</html>
